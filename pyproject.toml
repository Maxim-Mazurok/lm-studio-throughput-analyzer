[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-studio-throughput-analyzer"
version = "0.2.0"
description = "Analyze LM Studio server logs and generate private, offline throughput charts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxim Mazurok" }]
keywords = ["lm-studio", "llama.cpp", "benchmark", "llm", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.scripts]
lmstudio-throughput = "lmstudio_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
